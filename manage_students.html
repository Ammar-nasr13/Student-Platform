<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Security Gate: Redirect unauthorized students immediately -->
    <script>
        if (localStorage.getItem('is_faculty') !== 'true' || localStorage.getItem('faculty_email') !== 'techno-dms@hotmail.com') {
            window.location.href = 'index.html';
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلاب | تكنولوجيا صناعة السياحة والضيافة</title>
    <!-- SEO Meta Tags -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="application-name" content="تكنولوجيا صناعة السياحة والضيافة">

    <!-- Preconnect & Performance (Speed SEO) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" integrity="sha384-dpuaG1suU0eT09tx5plTaGMLBsfDLzUCCUXOY2j/LSvXYuG6Bqs43ALlhIqAJVRb" crossorigin="anonymous">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="css/style.min.css">
</head>
<body>
    <!-- شريط التنقل (Navbar) -->
    <nav class="navbar navbar-expand-xl navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none me-0" href="index.html">
                <img src="assets/logo.webp" alt="شعار القسم" class="navbar-brand-logo flex-shrink-0" width="48" height="48" loading="lazy">
                <div class="d-flex flex-column justify-content-center">
                    <span class="d-block lh-sm text-white fw-bold mb-1 text-truncate" style="font-size: 1.1rem;">تكنولوجيا صناعة السياحة والضيافة</span>
                    <small class="fw-light text-white-50 lh-sm text-truncate" style="font-size: 0.8rem;">كلية السياحة والفنادق - جامعة المنيا</small>
                </div>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars-staggered fs-3"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-xl-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link" href="add_exam.html">إدارة الاختبارات</a></li>
                </ul>
                <div class="d-flex ms-xl-3 align-items-center">
                    <button class="theme-toggle-btn me-2 d-none d-xl-flex" id="theme-toggle" title="تغيير المظهر">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <button class="btn btn-danger btn-sm px-3 rounded-pill fw-bold" onclick="logoutFaculty()"><i class="fa-solid fa-sign-out-alt me-1"></i> تسجيل الخروج</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- رأس الصفحة -->
    <header class="py-5 bg-primary bg-gradient text-center position-relative overflow-hidden">
        <div class="container position-relative z-1">
            <h1 class="fw-extrabold text-white mb-2"><i class="fa-solid fa-users text-warning me-2"></i> إدارة حسابات الطلاب</h1>
            <p class="text-white-50 lead">لوحة تحكم أعضاء هيئة التدريس لإضافة وتعديل بيانات الطلاب</p>
        </div>
    </header>

    <main class="container my-5 animated-fade-in">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
            <div class="card-header text-white py-3 d-flex flex-wrap justify-content-between align-items-center" style="background-color: #0f2b46;">
                <h5 class="fw-bold m-0">قائمة الطلاب المسجلين <i class="fa-solid fa-address-book ms-2"></i></h5>
                <div class="d-flex gap-2">
                    <button class="btn btn-success fw-bold btn-sm shadow-sm" onclick="loadStudents()">
                        <i class="fa-solid fa-arrows-rotate me-1"></i> تحديث
                    </button>
                    <button class="btn btn-warning fw-bold btn-sm shadow-sm" data-bs-toggle="modal" data-bs-target="#studentModal" onclick="openAddStudentModal()">
                        <i class="fa-solid fa-user-plus me-1"></i> إضافة طالب جديد
                    </button>
                </div>
            </div>
            <div class="card-body bg-light">
                <!-- شريط البحث الفلتر -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-search text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="search-student" placeholder="ابحث بالاسم أو الكود..." oninput="filterStudents()">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <select class="form-select" id="filter-level" onchange="filterStudents()">
                            <option value="">جميع المستويات</option>
                            <option value="1">المستوى الأول</option>
                            <option value="2">المستوى الثاني</option>
                            <option value="3">المستوى الثالث</option>
                            <option value="4">المستوى الرابع</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle text-center bg-white rounded-3 shadow-sm" dir="rtl">
                        <thead class="table-light text-primary">
                            <tr>
                                <th>م</th>
                                <th>كود الطالب</th>
                                <th>اسم الطالب</th>
                                <th>المستوى</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="students-table-body">
                            <tr><td colspan="5" class="text-muted p-4"><i class="fa-solid fa-spinner fa-spin me-2"></i> جاري تحميل بيانات الطلاب...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal إضافة / تعديل طالب -->
    <div class="modal fade" id="studentModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg">
                <div class="modal-header text-white border-0 bg-primary">
                    <h5 class="modal-title fw-bold m-0" id="studentModalTitle">إضافة طالب جديد</h5>
                    <button type="button" class="btn-close btn-close-white m-0" data-bs-dismiss="modal" style="margin-left: 0 !important; margin-right: auto !important;"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="student-form">
                        <input type="hidden" id="student-doc-id">
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold text-dark">اسم الطالب بالكامل</label>
                            <input type="text" class="form-control" id="student-form-name" required placeholder="مثال: أحمد محمد علي">
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold text-dark">كود الطالب</label>
                            <input type="text" class="form-control" id="student-form-code" required placeholder="مثال: 123456" dir="ltr">
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold text-dark">المستوى الدراسي</label>
                            <select class="form-select" id="student-form-level" required>
                                <option value="">-- اختر المستوى --</option>
                                <option value="1">المستوى الأول</option>
                                <option value="2">المستوى الثاني</option>
                                <option value="3">المستوى الثالث</option>
                                <option value="4">المستوى الرابع</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 bg-light rounded-bottom-4">
                    <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary fw-bold" id="save-student-btn" onclick="saveStudent()"><i class="fa-solid fa-save me-1"></i> حفظ البيانات</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نظام التنبيهات -->
    <div id="toast-container"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    
    <!-- Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1" defer></script>
    <script src="js/appwrite-config.js?v=1.0.2" defer></script>
    <script src="js/auth.js?v=1.0.3" defer></script>
    <script src="js/main.js?v=1.0.2" defer></script>
    <script src="js/manage_students.js?v=1.0.5" defer></script>
</body>
</html>
