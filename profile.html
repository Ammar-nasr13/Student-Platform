<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | تكنولوجيا صناعة السياحة والضيافة</title>
    <!-- SEO Meta Tags -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="application-name" content="تكنولوجيا صناعة السياحة والضيافة">

    <!-- Preconnect & Performance (Speed SEO) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" integrity="sha384-dpuaG1suU0eT09tx5plTaGMLBsfDLzUCCUXOY2j/LSvXYuG6Bqs43ALlhIqAJVRb" crossorigin="anonymous">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="css/style.min.css">

    <!-- Security Gate -->
    <script>
        if (localStorage.getItem('is_student') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body class="bg-light">

    <!-- شريط التنقل (Navbar) -->
    <nav class="navbar navbar-expand-xl navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none me-0" href="index.html">
                <img src="assets/logo.webp" alt="شعار القسم" class="navbar-brand-logo flex-shrink-0" width="48" height="48" loading="lazy">
                <div class="d-flex flex-column justify-content-center">
                    <span class="d-block lh-sm text-white fw-bold mb-1 text-truncate" style="font-size: 1.1rem;">تكنولوجيا صناعة السياحة والضيافة</span>
                    <small class="fw-light text-white-50 lh-sm text-truncate" style="font-size: 0.8rem;">كلية السياحة والفنادق - جامعة المنيا</small>
                </div>
            </a>
            
            <div class="d-flex align-items-center d-xl-none">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-xl-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link" href="exams.html">الاختبارات التفاعلية</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- المحتوى الرئيسي للملف الشخصي -->
    <main class="container my-5 animated-fade-in" style="max-width: 600px;">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <!-- Header Background -->
            <div class="bg-primary bg-gradient py-5 text-center position-relative">
                <div class="position-absolute top-0 start-50 translate-middle-x mt-4">
                    <div class="bg-white rounded-circle p-2 shadow-sm d-inline-block">
                        <div class="bg-primary bg-gradient text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 80px; height: 80px; font-size: 2.5rem;">
                            <i class="fa-solid fa-user-graduate"></i>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card-body px-4 pb-5 pt-5 text-center mt-3">
                <h3 class="fw-bold text-dark mb-1" id="profile-name">جاري التحميل...</h3>
                <p class="text-muted mb-4">طالب مقيد بالقسم</p>

                <div class="row g-3 justify-content-center mb-4">
                    <!-- Student Code -->
                    <div class="col-6">
                        <div class="p-3 bg-light rounded-3 border">
                            <i class="fa-solid fa-id-card fs-4 text-primary mb-2"></i>
                            <h6 class="text-muted small mb-1">كود الطالب</h6>
                            <div class="fw-bold fs-5 text-dark" id="profile-code" dir="ltr">...</div>
                        </div>
                    </div>
                    <!-- Student Level -->
                    <div class="col-6">
                        <div class="p-3 bg-light rounded-3 border">
                            <i class="fa-solid fa-layer-group fs-4 text-success mb-2"></i>
                            <h6 class="text-muted small mb-1">المستوى الدراسي</h6>
                            <div class="fw-bold fs-5 text-dark" id="profile-level">...</div>
                        </div>
                    </div>
                </div>

                <hr class="my-4 text-muted opacity-25">

                <div class="d-flex flex-column gap-2">
                    <a href="index.html" class="btn btn-outline-primary fw-bold py-2 rounded-3">
                        <i class="fa-solid fa-home me-2"></i> العودة للرئيسية
                    </a>
                    <button class="btn btn-danger fw-bold py-2 px-4 rounded-pill shadow-sm" onclick="logoutStudent()">
                        <i class="fa-solid fa-sign-out-alt me-2"></i> تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js?v=1.0.1"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const levelNames = {
                "1": "المستوى الأول",
                "2": "المستوى الثاني",
                "3": "المستوى الثالث",
                "4": "المستوى الرابع"
            };
            
            const name = localStorage.getItem("student_name") || "غير معروف";
            const code = localStorage.getItem("student_code") || "غير معروف";
            const lvl = localStorage.getItem("student_level") || "";
            const levelText = levelNames[lvl] || lvl || "غير معروف";

            document.getElementById("profile-name").textContent = name;
            document.getElementById("profile-code").textContent = code;
            document.getElementById("profile-level").textContent = levelText;
        });
    </script>
</body>
</html>
