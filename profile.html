<head>
    <meta charset="UTF-8">

    <!-- Preconnect & Performance (Speed SEO) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" integrity="sha384-dpuaG1suU0eT09tx5plTaGMLBsfDLzUCCUXOY2j/LSvXYuG6Bqs43ALlhIqAJVRb" crossorigin="anonymous">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="css/style.min.css">

    <!-- Security Gate -->
    <script>
        const isStudent = localStorage.getItem('is_student') === 'true';
        const isDBAdmin = localStorage.getItem('faculty_email') === 'techno-dms@hotmail.com';
        if (!isStudent && !isDBAdmin) {
            window.location.href = 'index.html';
        }
    </script>
    <style>
        .profile-card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            border-radius: 12px;
        }
        .profile-header-bg {
            background: linear-gradient(135deg, #0f2b46 0%, #1a365d 100%);
            height: 140px;
            border-radius: 12px 12px 0 0;
        }
        .profile-avatar-container {
            margin-top: -60px;
            position: relative;
            z-index: 1;
        }
        .profile-avatar {
            width: 110px;
            height: 110px;
            background: #fff;
            border: 5px solid #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #0f2b46;
            margin: 0 auto;
        }
        .info-box {
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
            background: #f8fafc;
        }
        .info-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
            background: #ffffff;
            border-color: #0f2b46;
        }
        .btn-custom {
            border-radius: 0 !important;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }
    </style>
</head>
<body class="bg-light">

    <!-- شريط التنقل (Navbar) -->
    <nav class="navbar navbar-expand-xl navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none me-0" href="index.html">
                <img src="assets/logo.webp" alt="شعار القسم" class="navbar-brand-logo flex-shrink-0" width="48" height="48" loading="lazy">
                <div class="d-flex flex-column justify-content-center">
                    <span class="d-block lh-sm text-white fw-bold mb-1 text-truncate" style="font-size: 1.1rem;">تكنولوجيا صناعة السياحة والضيافة</span>
                    <small class="fw-light text-white-50 lh-sm text-truncate" style="font-size: 0.8rem;">كلية السياحة والفنادق - جامعة المنيا</small>
                </div>
            </a>
            
            <div class="d-flex align-items-center d-xl-none">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-xl-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link" href="exams.html">الاختبارات التفاعلية</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- المحتوى الرئيسي للملف الشخصي -->
    <main class="container my-5 animated-fade-in" style="max-width: 650px;">
        <div class="profile-card overflow-hidden">
            <!-- Header Background -->
            <div class="profile-header-bg"></div>
            
            <div class="card-body px-4 pb-5 text-center">
                <div class="profile-avatar-container mb-3">
                    <div class="profile-avatar rounded-circle mx-auto">
                        <i class="fa-solid fa-user-graduate"></i>
                    </div>
                </div>
                
                <h3 class="fw-bold text-dark mb-1" id="profile-name">جاري التحميل...</h3>
                <p class="text-muted mb-4 fs-6" id="profile-role">طالب مقيد بالقسم</p>

                <div class="row g-3 justify-content-center mb-4">
                    <!-- Student Code / Email -->
                    <div class="col-12 col-sm-6" id="code-col">
                        <div class="info-box p-4 rounded-3 h-100">
                            <i class="fa-solid fa-id-card fs-3 text-primary mb-3" id="code-icon"></i>
                            <h6 class="text-muted mb-2 fw-bold" id="code-label" style="font-size: 0.9rem;">كود الطالب</h6>
                            <div class="fw-bold text-dark text-break" id="profile-code" dir="ltr" style="font-size: 1.15rem;">...</div>
                        </div>
                    </div>
                    <!-- Student Level / Status -->
                    <div class="col-12 col-sm-6" id="level-container">
                        <div class="info-box p-4 rounded-3 h-100">
                            <i class="fa-solid fa-layer-group fs-3 text-success mb-3"></i>
                            <h6 class="text-muted mb-2 fw-bold" style="font-size: 0.9rem;">المستوى الدراسي</h6>
                            <div class="fw-bold text-dark text-break" id="profile-level" style="font-size: 1.15rem;">...</div>
                        </div>
                    </div>
                </div>

                <hr class="my-4 text-muted opacity-10">

                <div class="d-flex flex-column gap-3 mt-4">
                    <a href="index.html" class="btn btn-outline-primary fw-bold py-3 btn-custom">
                        <i class="fa-solid fa-home me-2"></i> العودة للرئيسية
                    </a>
                    <button class="btn btn-danger fw-bold py-3 px-4 btn-custom shadow-sm" onclick="logoutStudent()">
                        <i class="fa-solid fa-sign-out-alt me-2"></i> تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js?v=1.0.4"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const isDBAdmin = localStorage.getItem('faculty_email') === 'techno-dms@hotmail.com';
            
            if (isDBAdmin) {
                document.getElementById("profile-name").textContent = "مسؤول قاعدة البيانات";
                document.getElementById("profile-role").textContent = "مدير النظام الأساسي";
                document.getElementById("code-label").textContent = "البريد الإلكتروني";
                document.getElementById("profile-code").textContent = "techno-dms@hotmail.com";
                document.getElementById("code-icon").className = "fa-solid fa-envelope fs-4 text-primary mb-2";
                document.getElementById("level-container").style.display = "none";
                
                // Make the email container full width and prevent word break
                const codeCol = document.getElementById("code-col");
                if (codeCol) {
                    codeCol.className = "col-12";
                }
                const profileCode = document.getElementById("profile-code");
                if (profileCode) {
                    profileCode.classList.remove("text-break");
                    profileCode.style.fontSize = "clamp(0.9rem, 4vw, 1.25rem)";
                }
                
                // Update logout button to faculty logout
                const logoutBtn = document.querySelector('button[onclick="logoutStudent()"]');
                if (logoutBtn) {
                    logoutBtn.setAttribute("onclick", "logoutFaculty()");
                }
            } else {
                const levelNames = {
                    "1": "المستوى الأول",
                    "2": "المستوى الثاني",
                    "3": "المستوى الثالث",
                    "4": "المستوى الرابع"
                };
                
                const name = localStorage.getItem("student_name") || "غير معروف";
                const code = localStorage.getItem("student_code") || "غير معروف";
                const lvl = localStorage.getItem("student_level") || "";
                const levelText = levelNames[lvl] || lvl || "غير معروف";

                document.getElementById("profile-name").textContent = name;
                document.getElementById("profile-code").textContent = code;
                document.getElementById("profile-level").textContent = levelText;
            }
        });
    </script>
</body>
</html>
