<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | أعضاء هيئة التدريس</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="الملف الشخصي لأعضاء هيئة التدريس وتفاصيل المقررات المخصصة لهم.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://tourism-tech.online/faculty_profile.html">
    <meta name="application-name" content="تكنولوجيا صناعة السياحة والضيافة">

    <!-- Preconnect & Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" crossorigin="anonymous">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="css/style.min.css">

    <!-- Security Gate -->
    <script>
        const isFaculty = localStorage.getItem('is_faculty') === 'true';
        if (!isFaculty) {
            window.location.href = 'index.html';
        }
    </script>
    <style>
        .profile-card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            border-radius: 12px;
        }
        .profile-header-bg {
            background: linear-gradient(135deg, #0f2b46 0%, #1a365d 100%);
            height: 140px;
            border-radius: 12px 12px 0 0;
        }
        .profile-avatar-container {
            margin-top: -60px;
            position: relative;
            z-index: 1;
        }
        .profile-avatar {
            width: 110px;
            height: 110px;
            background: #fff;
            border: 5px solid #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #0f2b46;
            margin: 0 auto;
        }
        .info-box {
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
            background: #f8fafc;
        }
        .info-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
            background: #ffffff;
            border-color: #0f2b46;
        }
        .btn-custom {
            border-radius: 0 !important;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }
        .subject-badge {
            transition: all 0.2s ease;
        }
        .subject-badge:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-xl navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none me-0" href="index.html">
                <img src="assets/logo.webp" alt="شعار القسم" class="navbar-brand-logo flex-shrink-0" width="48" height="48" loading="lazy">
                <div class="d-flex flex-column justify-content-center">
                    <span class="d-block lh-sm text-white fw-bold mb-1 text-truncate" style="font-size: 1.1rem;">تكنولوجيا صناعة السياحة والضيافة</span>
                    <small class="fw-light text-white-50 lh-sm text-truncate" style="font-size: 0.8rem;">كلية السياحة والفنادق - جامعة المنيا</small>
                </div>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-xl-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link" href="add_exam.html">إضافة اختبار</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5 animated-fade-in" style="max-width: 700px;">
        <div class="profile-card overflow-hidden">
            <!-- Header Background -->
            <div class="profile-header-bg"></div>
            
            <div class="card-body px-4 pb-5 text-center">
                <div class="profile-avatar-container mb-3">
                    <div class="profile-avatar rounded-circle mx-auto">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                </div>
                
                <h3 class="fw-bold text-dark mb-1" id="faculty-name">جاري التحميل...</h3>
                <p class="text-muted mb-4 fs-6">عضو هيئة تدريس بالقسم</p>

                <div class="row justify-content-center mb-4">
                    <div class="col-12" id="email-col">
                        <div class="info-box p-4 rounded-3 h-100">
                            <i class="fa-solid fa-envelope fs-3 text-primary mb-3"></i>
                            <h6 class="text-muted mb-2 fw-bold" style="font-size: 0.9rem;">البريد الإلكتروني</h6>
                            <div class="fw-bold text-dark" id="faculty-email" dir="ltr" style="font-size: 1.15rem;">...</div>
                        </div>
                    </div>
                </div>

                <hr class="my-4 text-muted opacity-10">

                <!-- Assigned Subjects -->
                <div class="text-start mb-4">
                    <h5 class="fw-bold text-dark mb-3 fs-5"><i class="fa-solid fa-book-open text-warning me-2"></i> المقررات المخصصة لك:</h5>
                    <div id="faculty-subjects-container" class="d-flex flex-wrap gap-2">
                        <!-- Subjects will be injected here -->
                    </div>
                </div>

                <div class="d-flex flex-column gap-3 mt-5">
                    <a href="index.html" class="btn btn-outline-primary fw-bold py-3 btn-custom">
                        <i class="fa-solid fa-home me-2"></i> العودة للرئيسية
                    </a>
                    <button class="btn btn-danger fw-bold py-3 px-4 btn-custom shadow-sm" onclick="logoutFaculty()">
                        <i class="fa-solid fa-sign-out-alt me-2"></i> تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js?v=1.0.4"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const name = localStorage.getItem("faculty_name") || "غير معروف";
            const email = localStorage.getItem("faculty_email") || "غير معروف";
            
            document.getElementById("faculty-name").textContent = name;
            document.getElementById("faculty-email").textContent = email;

            let subjects = [];
            try {
                subjects = JSON.parse(localStorage.getItem("faculty_subjects") || "[]");
            } catch (e) {
                console.error(e);
            }

            const container = document.getElementById("faculty-subjects-container");
            if (subjects.length > 0) {
                container.innerHTML = subjects.map(sub => 
                    `<span class="badge bg-white text-primary border border-primary-subtle py-2 px-3 fw-bold fs-6 shadow-sm subject-badge">${sub}</span>`
                ).join('');
            } else {
                container.innerHTML = `<p class="text-muted small m-0"><i class="fa-solid fa-circle-info me-1"></i> لا توجد مقررات مخصصة لك حتى الآن. يرجى مراجعة مسؤول قاعدة البيانات.</p>`;
            }
        });
    </script>
</body>
</html>
